<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="description"
      content="NotesVault is a notes and knowledge-management application."
    />
    <meta name="theme-color" content="#fbfaf8" />

    <script>
      (() => {
        const storageKey = "notesvault-theme";
        const darkQuery = "(prefers-color-scheme: dark)";
        const storedTheme = localStorage.getItem(storageKey);

        const preference =
          storedTheme === "light" ||
          storedTheme === "dark" ||
          storedTheme === "system"
            ? storedTheme
            : "system";

        const resolvedTheme =
          preference === "system"
            ? window.matchMedia(darkQuery).matches
              ? "dark"
              : "light"
            : preference;

        const rootElement = document.documentElement;
        const themeColorElement = document.querySelector(
          'meta[name="theme-color"]',
        );

        rootElement.classList.toggle(
          "dark",
          resolvedTheme === "dark",
        );

        rootElement.dataset.theme = resolvedTheme;
        rootElement.style.colorScheme = resolvedTheme;

        if (themeColorElement) {
          themeColorElement.setAttribute(
            "content",
            resolvedTheme === "dark" ? "#07111f" : "#fbfaf8",
          );
        }
      })();
    </script>

    <title>NotesVault</title>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
